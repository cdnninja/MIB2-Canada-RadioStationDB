name: Build RadioStationDB

# Checks every pull request: validates the data tables, builds the database and
# attaches a logo preview. Run it manually to get a test build of any branch.
# Releases are published by release.yml.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow

      - name: Validate, build and package
        run: tools/package.sh "dev-${{ github.run_number }}"

      - name: Summary
        run: cat dist/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logo preview
        uses: actions/upload-artifact@v4
        with:
          name: logo-preview
          path: dist/logo-preview.png
          retention-days: 14

      - name: Upload test build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MIB2-Canada-RSDB-dev-${{ github.run_number }}
          path: dist/MIB2-Canada-RSDB-dev-${{ github.run_number }}.zip
          retention-days: 7
          compression-level: 0
